[project]
name = "heatsim"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy==2.5.2",
    "scipy==1.18.1",
    "matplotlib==3.11.1",
    "pandas==3.0.5",
    "threadpoolctl==3.7.0",
    "psutil==7.2.2",
    "pypardiso",
    "nist-calculators",
    "mendeleev",
    "jax"
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["Sim*"]